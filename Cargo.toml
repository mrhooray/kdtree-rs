[package]
name = "kdtree"
version = "0.8.1"
edition = "2024"
description = "K-dimensional tree in Rust for fast geospatial indexing and nearest neighbors lookup"
readme = "README.md"
documentation = "https://docs.rs/kdtree"
repository = "https://github.com/mrhooray/kdtree-rs"
license = "MIT OR Apache-2.0"
keywords = ["tree", "nearest", "neighbor", "search", "geo"]

[dependencies]
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = ["alloc"] }
serde_derive = { version = "1.0", optional = true }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
kdtree = { path = ".", features = ["serialize"] }
serde = "1.0"
serde_json = "1.0"
criterion = { version = "0.8", default-features = false }

[features]
default = ["std"]
std = ["num-traits/std", "thiserror/std", "serde?/std"]
libm = ["num-traits/libm"]
serialize = ["serde", "serde_derive"]

[[bench]]
name = "bench"
harness = false
