name: rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -Dwarnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test --all-features
  check-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1, riscv32imac-unknown-none-elf
      - run: cargo check --all-targets --all-features --target wasm32-unknown-unknown
      - run: cargo check --all-targets --all-features --target wasm32-wasip1
      - run: cargo check --lib --no-default-features --features libm --target riscv32imac-unknown-none-elf
      - run: cargo check --lib --no-default-features --features libm,serialize --target riscv32imac-unknown-none-elf
  bench:
    runs-on: ubuntu-latest
    needs: [lint, test, check-targets]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo install critcmp --locked
      - run: bash benches/ci.sh
